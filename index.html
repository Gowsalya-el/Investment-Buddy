/* ── Reset & Base ── */

button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, select { font-family: inherit; }

/* ── Colours ── */
:root {
  --brand-50:  #eef2ff;
  --brand-100: #e0e7ff;
  --brand-200: #c7d2fe;
  --brand-300: #a5b4fc;
  --brand-400: #818cf8;
  --brand-500: #6366f1;

<script>
// ═══════════════════════════════════════════════════════════════════
//  INVESTMENT BUDDY — Complete Single-File Application
//  Vanilla JS + CSS only (no build step, no npm needed)
// ═══════════════════════════════════════════════════════════════════

// ─── Investment Engine ────────────────────────────────────────────
const Engine = (() => {

  function detectGeneration(birthYear) {
    if (birthYear >= 2013) return { label:'Gen Alpha',        emoji:'🌟', color:'purple' }
    if (birthYear >= 1997) return { label:'Gen Z',            emoji:'⚡', color:'blue'   }
    if (birthYear >= 1981) return { label:'Millennial',       emoji:'💻', color:'indigo' }
    if (birthYear >= 1965) return { label:'Gen X',            emoji:'🎸', color:'orange' }
    if (birthYear >= 1946) return { label:'Baby Boomer',      emoji:'🕊️', color:'green'  }
    return                        { label:'Silent Generation', emoji:'📚', color:'gray'   }
  }

  function getRiskInfo(score) {
    if (score >= 75) return { level:'Aggressive',      label:'High Growth',           icon:'🚀', gaugeColor:'#ef4444' }
    if (score >= 50) return { level:'Moderate',        label:'Balanced Growth',       icon:'⚖️', gaugeColor:'#f97316' }
    if (score >= 25) return { level:'Conservative',    label:'Steady & Safe',         icon:'🛡️', gaugeColor:'#3b82f6' }
    return                  { level:'Very Conservative',label:'Capital Preservation',  icon:'🏦', gaugeColor:'#22c55e' }
  }

  function genProfile(generation) {
    const map = {
      'Gen Alpha':         { riskBonus:10,  horizonYears:50, focus:'Education & Long-term Growth' },
      'Gen Z':             { riskBonus:8,   horizonYears:40, focus:'Wealth Building & Financial Independence' },
      'Millennial':        { riskBonus:5,   horizonYears:30, focus:'Home, Family & Retirement Prep' },
      'Gen X':             { riskBonus:0,   horizonYears:20, focus:'Peak Earning & Retirement Build-up' },
      'Baby Boomer':       { riskBonus:-8,  horizonYears:10, focus:'Capital Preservation & Income' },
      'Silent Generation': { riskBonus:-15, horizonYears:5,  focus:'Income, Safety & Legacy Planning' },
    }
    return map[generation] || map['Millennial']
  }

  function accountAdj(accountType) {
    const map = {
      'checking':   { delta:-5,  note:'Day-to-day account — prioritise liquid, low-risk assets first.' },
      'savings':    { delta:0,   note:'Solid foundation — a healthy mix of liquid and growth assets.' },
      'brokerage':  { delta:10,  note:'Investment-ready account — higher growth allocation is ideal.' },
      'roth_ira':   { delta:8,   note:'Tax-free growth — great for long-term aggressive compounding.' },
      '401k':       { delta:6,   note:'Always contribute enough to get your full employer match — it\'s free money.' },
      'isa':        { delta:8,   note:'Tax-free ISA wrapper — maximise compounding growth year after year.' },
      'retirement': { delta:5,   note:'Long-horizon account — focus on tax-efficient diversified growth.' },
      'other':      { delta:0,   note:'Diversified multi-asset approach recommended.' },
    }
    return map[accountType] || map['other']
  }

  function compound(monthly, annualRate, years) {
    const r = annualRate / 100 / 12, m = years * 12
    if (r === 0) return monthly * m
    return Math.round(monthly * ((Math.pow(1+r,m)-1)/r))
  }

  function fmtCurrency(n) {
    if (n >= 1e6) return '$'+(n/1e6).toFixed(1)+'M'
    if (n >= 1e3) return '$'+(n/1e3).toFixed(0)+'K'
    return '$'+n.toLocaleString()
  }

  function buildPortfolio(profile) {
    const { age, generation, accountType, riskScore, monthlySavings=500 } = profile
    const gp   = genProfile(generation)
    const adj  = accountAdj(accountType)
    const ageE = Math.max(10, Math.min(90, 110 - age))
    const adjScore = Math.max(0, Math.min(100, riskScore + gp.riskBonus + adj.delta))
    const rInfo    = getRiskInfo(adjScore)
    const equity   = Math.round(Math.max(5,Math.min(95, ageE*0.4 + adjScore*0.6)))
    const fixed    = 100 - equity

    let alloc = []
    if (rInfo.level === 'Aggressive') {
      alloc = [
        { name:'US Growth Stocks',         pct:Math.round(equity*.35), color:'#6366f1', risk:'High',   desc:'Large-cap tech & growth (e.g. S&P 500 Growth ETF, VTI)' },
        { name:'International Stocks',     pct:Math.round(equity*.25), color:'#8b5cf6', risk:'High',   desc:'Emerging markets & global diversification (VXUS)' },
        { name:'Small-Cap / Value Stocks', pct:Math.round(equity*.20), color:'#a78bfa', risk:'High',   desc:'High-potential smaller companies for extra growth' },
        { name:'REITs / Real Assets',      pct:Math.round(equity*.10), color:'#f59e0b', risk:'Medium', desc:'Real estate investment trusts for income + growth' },
        { name:'Corporate Bonds',          pct:Math.round(fixed *.55), color:'#10b981', risk:'Low',    desc:'Investment-grade bonds — stability anchor (BND)' },
        { name:'Government Bonds',         pct:Math.round(fixed *.30), color:'#34d399', risk:'Low',    desc:'Treasury bonds — safest fixed income available' },
        { name:'Cash / Money Market',      pct:Math.round(fixed *.15), color:'#6ee7b7', risk:'None',   desc:'Liquid emergency buffer, money-market funds' },
      ]
    } else if (rInfo.level === 'Moderate') {
      alloc = [
        { name:'Index Funds (Total Market)',pct:Math.round(equity*.45), color:'#6366f1', risk:'Medium', desc:'Broad market exposure via low-cost index funds (VTI)' },
        { name:'International Stocks',      pct:Math.round(equity*.25), color:'#8b5cf6', risk:'Medium', desc:'Developed market international equities (VXUS)' },
        { name:'Dividend Stocks',           pct:Math.round(equity*.20), color:'#ec4899', risk:'Medium', desc:'Stable dividend-paying blue-chips (SCHD)' },
        { name:'REITs',                     pct:Math.round(equity*.10), color:'#f59e0b', risk:'Medium', desc:'Real estate exposure without direct ownership (VNQ)' },
        { name:'Corporate Bonds',           pct:Math.round(fixed *.50), color:'#10b981', risk:'Low',   desc:'Mix of investment-grade bond funds (BND, VCSH)' },
        { name:'Government Bonds',          pct:Math.round(fixed *.35), color:'#34d399', risk:'Low',   desc:'US Treasuries & government securities (VGLT)' },
        { name:'Cash / Savings',            pct:Math.round(fixed *.15), color:'#6ee7b7', risk:'None',  desc:'3-6 month emergency fund in high-yield savings' },
      ]
    } else if (rInfo.level === 'Conservative') {
      alloc = [
        { name:'Government Bonds / TIPS',   pct:Math.round(fixed *.40), color:'#34d399', risk:'Low',    desc:'Treasury bonds + TIPS for inflation protection' },
        { name:'Corporate Bonds',           pct:Math.round(fixed *.30), color:'#10b981', risk:'Low',    desc:'Investment-grade corporate bonds (VCSH)' },
        { name:'Dividend / Value Stocks',   pct:Math.round(equity*.50), color:'#6366f1', risk:'Medium', desc:'Blue-chip dividend-paying companies (SCHD, VYM)' },
        { name:'Index Funds',               pct:Math.round(equity*.30), color:'#8b5cf6', risk:'Medium', desc:'Low-cost diversified total-market index (VTI)' },
        { name:'REITs',                     pct:Math.round(equity*.20), color:'#f59e0b', risk:'Medium', desc:'Stable real estate income (VNQ)' },
        { name:'Cash / CDs',               pct:Math.round(fixed *.30), color:'#6ee7b7', risk:'None',   desc:'High-yield savings, CDs, money market (4-5% APY)' },
      ]
    } else {
      alloc = [
        { name:'Government Bonds / TIPS',  pct:35, color:'#34d399', risk:'Low',  desc:'Treasury bonds indexed to inflation — I-Bonds, TIPS' },
        { name:'High-Yield Savings / CDs', pct:25, color:'#6ee7b7', risk:'None', desc:'FDIC-insured high-interest accounts (4.5-5%+ APY)' },
        { name:'Money Market Funds',       pct:15, color:'#a7f3d0', risk:'None', desc:'Liquid, safe short-term instruments — SPAXX, VMFXX' },
        { name:'Investment-Grade Bonds',   pct:15, color:'#10b981', risk:'Low',  desc:'AAA/AA-rated corporate debt for steady income (BND)' },
        { name:'Dividend Stocks',          pct:7,  color:'#6366f1', risk:'Low',  desc:'Stable income-producing equities — JNJ, KO, VYM' },
        { name:'Cash Equivalents',         pct:3,  color:'#c7d2fe', risk:'None', desc:'Ultra-liquid buffer — T-Bills, short-term notes' },
      ]
    }

    // Normalise to exactly 100% (largest-remainder method to avoid rounding drift)
    const tot = alloc.reduce((s,a)=>s+a.pct,0)
    const scaled = alloc.map(a=>({...a, exact:a.pct/tot*100}))
    scaled.forEach(a=>a.pct=Math.floor(a.exact))
    let remainder = 100 - scaled.reduce((s,a)=>s+a.pct,0)
    scaled.sort((a,b)=>(b.exact-b.pct)-(a.exact-a.pct))
    for(let i=0;i<remainder;i++) scaled[i % scaled.length].pct++
    // restore original display order
    alloc = scaled.sort((a,b)=>b.pct-a.pct).map(({exact,...rest})=>rest)

    const returns = {
      'Aggressive':       { low:7,  mid:10, high:14 },
      'Moderate':         { low:5,  mid:7,  high:10 },
      'Conservative':     { low:3,  mid:5,  high:7  },

    }[rInfo.level]

    const horizon = gp.horizonYears
    const proj = {
      y10:     compound(monthlySavings, returns.mid, 10),
      y20:     compound(monthlySavings, returns.mid, 20),
      yHorizon:compound(monthlySavings, returns.mid, horizon),
      horizon,
    }

    const warnings = []
    if (age >= 60 && adjScore >= 65) warnings.push({ type:'warning', msg:'⚠️ Your risk appetite is high for your age. Consider gradually reducing equity exposure to protect accumulated wealth.' })
    if (age < 30 && adjScore < 25)   warnings.push({ type:'info',    msg:'💡 Young investors benefit most from higher risk tolerance — time in the market is your greatest advantage.' })

    if (age >= 50) warnings.push({ type:'tip', msg:'🎯 Catch-up contributions available: extra $1,000/yr to IRAs, $7,500/yr to 401(k)s.' })

    return { rInfo, adjScore, alloc, returns, gp, adj, proj, warnings, fmtCurrency }
  }

  const RECOMMENDATIONS = {

    ],
    'Baby Boomer': [

      { icon:'💊', title:'Healthcare Cost Planning',        desc:'HSA contributions and Medicare supplement insurance are key hedges against healthcare inflation.' },
      { icon:'🏦', title:'Required Minimum Distributions',  desc:'Plan for RMDs from tax-deferred accounts starting at age 73 to avoid a 25% penalty.' },
    ],
    'Silent Generation': [
      { icon:'🏦', title:'Capital Preservation First',      desc:'FDIC-insured accounts, government bonds, and annuities protect your principal above all else.' },
      { icon:'📜', title:'Estate & Legacy Planning',        desc:'Review wills, trusts, and beneficiary designations to ensure assets transfer as intended.' },
      { icon:'💵', title:'Dividend Income Strategy',        desc:'Blue-chip dividend stocks provide steady income with moderate inflation protection.' },
    ],
  }

  const PRODUCTS = {
    'Aggressive':       [
      { icon:'📦', title:'VTI — Total Stock Market ETF',   desc:"Vanguard's flagship low-cost ETF covering the entire US equity market. 0.03% expense ratio." },
      { icon:'🌍', title:'VXUS — International ETF',       desc:'Diversifies beyond US with developed and emerging market exposure in a single fund.' },

      { icon:'💳', title:'CDs (Certificates of Deposit)',  desc:'Lock in current high rates for 6-24 months with FDIC protection up to $250,000.' },

  }

  function getRecommendations(generation, riskLevel) {
    return [
      ...(RECOMMENDATIONS[generation] || RECOMMENDATIONS['Millennial']),
      ...(PRODUCTS[riskLevel] || [])
    ]
  }

  return { detectGeneration, buildPortfolio, getRecommendations, fmtCurrency }
})()

    const age = new Date().getFullYear()-yr
    const gen = Engine.detectGeneration(yr)
    setState({errors:{},step:1,profile:{...state.profile,name:s1.name.trim(),birthYear:yr,age,generation:gen.label,goals:[...s1.goals]}})
  }
}

function bindStep3() {
  document.querySelectorAll('.q-dot-btn').forEach(b=>b.onclick=()=>{s3.current=parseInt(b.dataset.i);refreshStep3()})
  document.querySelectorAll('.q-opt-btn').forEach(b=>b.onclick=()=>{
    const q = QUESTIONS[s3.current]
    s3.answers[q.id] = parseInt(b.dataset.score)
    if (s3.current < QUESTIONS.length - 1) {
      setTimeout(()=>{s3.current++;refreshStep3()},250)
    } else {
      refreshStep3()
    }
  })

  const prev = document.getElementById('s3-prev')
  if(prev) prev.onclick=()=>{
    if(s3.current>0){s3.current--;refreshStep3()}
    else setState({step:1,errors:{}})
  }

  const nextQ = document.getElementById('s3-next-q')
  if(nextQ) nextQ.onclick=()=>{s3.current++;refreshStep3()}

  const submit = document.getElementById('s3-submit')
  if(submit) submit.onclick=()=>{
    const tot=QUESTIONS.length
    if(Object.keys(s3.answers).length<tot) return
    const raw  = Object.values(s3.answers).reduce((a,b)=>a+b,0)
    const score= Math.round(raw/tot)
    const result = Engine.buildPortfolio({...state.profile, riskScore:score})
    const recs   = Engine.getRecommendations(state.profile.generation, result.rInfo.level)
    setState({screen:'results', profile:{...state.profile,riskScore:score}, result:{...result,recs}})
  }
}

function refreshStep3() {
  const container = document.querySelector('.anim-slide')
  if(container){container.innerHTML=renderStep3();bindStep3()}
}

function renderGauge(score, color) {
  const angle  = -90 + (score/100)*180
  const rad    = angle * Math.PI/180
  const nx     = 100 + 70*Math.cos(rad)
  const ny     = 100 + 70*Math.sin(rad)
  return `
  <div class="gauge-wrap" style="flex-shrink:0">
    <svg viewBox="0 0 200 115" style="width:180px">

// ── SVG Donut ──
function renderDonut(alloc) {
  const cx=110, cy=110, r=90, ir=50
  const circ = 2*Math.PI*r
  let offset = 0
  const slices = alloc.map(a=>{
    const dash = (a.pct/100)*circ
    const gap  = circ - dash
    const s    = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${a.color}" stroke-width="${r-ir}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${-offset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`
    offset += dash
    return s
  })
  const top2 = [...alloc].sort((a,b)=>b.pct-a.pct).slice(0,1)[0]
  return `<svg viewBox="0 0 220 220" style="width:100%;height:100%">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="${r-ir}"/>
    ${slices.join('')}
    <text x="${cx}" y="${cy-8}"  text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="500">largest</text>
    <text x="${cx}" y="${cy+8}"  text-anchor="middle" font-size="15" fill="${top2?.color||'#6366f1'}" font-weight="900">${top2?.pct||0}%</text>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="9"  fill="#9ca3af">${top2?.name?.split(' ').slice(0,2).join(' ')||''}</text>
  </svg>`
}

// ── Bar Chart ──
function renderBarChart(data, fmt) {
  const max  = Math.max(...data.map(d=>d.val))
  const h    = 180
  return `
<div style="display:flex;align-items:flex-end;gap:1rem;height:${h+40}px;padding:.5rem 0">
  ${data.map(d=>{
    const barH = Math.max(12, Math.round((d.val/max)*h))
    return `
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.375rem">
    <span style="font-size:.75rem;font-weight:700;color:#374151">${fmt(d.val)}</span>
    <div style="width:100%;height:${barH}px;border-radius:.5rem .5rem 0 0;background:${d.color};transition:height .6s ease;min-width:28px"></div>
    <span style="font-size:.7rem;font-weight:600;color:#9ca3af;text-align:center">${d.label}</span>
  </div>`}).join('')}
</div>`
}

// ── Area Chart (pure SVG) ──
function renderAreaChart(data, fmt) {
  const W=600, H=200, PAD_L=60, PAD_B=30, PAD_T=10
  const iW = W-PAD_L-10, iH = H-PAD_B-PAD_T
  const maxV = Math.max(...data.map(d=>d.hi))

  function scaleX(i){ return PAD_L + (i/(data.length-1))*iW }
  function scaleY(v){ return PAD_T + iH - (v/maxV)*iH }

  function polyline(key, stroke, fill){
    const pts = data.map((d,i)=>`${scaleX(i).toFixed(1)},${scaleY(d[key]).toFixed(1)}`).join(' ')
    const areaPts = data.map((d,i)=>`${scaleX(i).toFixed(1)},${scaleY(d[key]).toFixed(1)}`).join(' ')
      + ` ${scaleX(data.length-1).toFixed(1)},${(PAD_T+iH).toFixed(1)} ${scaleX(0).toFixed(1)},${(PAD_T+iH).toFixed(1)}`
    return `
    <polygon points="${areaPts}" fill="${fill}" opacity=".18"/>
    <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
  }

  const yLines = 4
  let yLabels = '', gridLines = ''
  for(let i=0;i<=yLines;i++){
    const v = (maxV/yLines)*i
    const y = scaleY(v)
    yLabels  += `<text x="${PAD_L-6}" y="${y.toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af" dominant-baseline="middle">${fmt(v)}</text>`
    gridLines+= `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W-10}" y2="${y.toFixed(1)}" stroke="#f1f5f9" stroke-width="1"/>`
  }

  const xLabels = data.map((d,i)=>`<text x="${scaleX(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#9ca3af">${d.y}</text>`).join('')

  return `
<div style="overflow-x:auto">
<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:240px">
  ${gridLines}
  ${polyline('hi',  '#22c55e', '#22c55e')}
  ${polyline('exp', '#6366f1', '#6366f1')}
  ${polyline('lo',  '#f97316', '#f97316')}
  ${yLabels}
  ${xLabels}
</svg>
</div>`
}
